version: "3.9"

services:
  backend:
    build: ./backend
    container_name: medspatial-backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/medspatial.db
      - UPLOAD_DIR=./data/uploads
      - VOLUME_DIR=./data/volumes
      - MESH_DIR=./data/meshes
      - ANALYSIS_DIR=./data/analysis
      - MODEL_DIR=./models
      - PROFILE=lightweight
      - DEVICE_PREFERENCE=auto
      - LAZY_MODEL_LOADING=true
      - DEBUG=false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    container_name: medspatial-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  data:
  models:
